# Cliente web Aceros We-Corp (contenedor cliente-web).
# Mismos prefijos que el proxy de Vite en desarrollo: el navegador habla con un solo origen.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API de Catálogo e Identidad: /catalogo/api/v1/... -> http://api-catalogo:8080/api/v1/...
  location /catalogo/ {
    proxy_pass http://api-catalogo:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API de Ventas: /ventas/api/v1/... -> http://api-ventas:8080/api/v1/...
  location /ventas/ {
    proxy_pass http://api-ventas:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Archivos con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta (por ejemplo /notas) carga index.html y la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
