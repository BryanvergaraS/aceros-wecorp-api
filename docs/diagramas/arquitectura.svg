t="spacing" textLength="255.8145" x="554" y="508.2207">POST /api/v1/productos/stock/reponer</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="304.7461" x="554" y="525.1602">Si Cat&#225;logo no responde: 503 ProblemDetails.</text></g><g id="elem_GMN20"><path d="M544.5,873.7793 L544.5,907.6582 A5,5 0 0 0 549.5,912.6582 L918.6963,912.6582 A5,5 0 0 0 923.6963,907.6582 L923.6963,878.7793 L913.6963,868.7793 L691.96,868.7793 L498.02,781.2893 L683.96,868.7793 L549.5,868.7793 A5,5 0 0 0 544.5,873.7793 " fill="#FFFDF2" style="stroke:#B8A86A;stroke-width:0.5;"/><path d="M913.6963,868.7793 L913.6963,876.2793 A2.5,2.5 0 0 0 916.1963,878.7793 L923.6963,878.7793 L913.6963,868.7793 " fill="#FFFDF2" style="stroke:#B8A86A;stroke-width:0.5;"/><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="307.5352" x="550.5" y="887.3418">Llave JWT compartida (Jwt__Key) por variable</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="358.1963" x="550.5" y="904.2813">de entorno; mismo emisor y audiencia en ambas APIs.</text></g><!--link V to WEB--><g id="link_V_WEB"><path d="M152.45,126.5493 C151.01,141.8193 151.41,159.3093 157,174.2793 C163.93,192.8193 171.9721,205.6951 184.9221,220.7151 " fill="none" id="V-to-WEB" style="stroke:#1F3A5F;stroke-width:1.1;"/><polygon fill="#1F3A5F" points="188.84,225.2593,185.9926,215.831,185.5751,221.4725,179.9336,221.055,188.84,225.2593" style="stroke:#1F3A5F;stroke-width:1.1;"/><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="131.4004" x="158" y="170.8418">HTTPS (navegador)</text></g><!--link A to WEB--><g id="link_A_WEB"><path d="M315.82,126.4293 C309.06,141.3693 301.2,158.6493 294,174.2793 C286.35,190.8793 280.4635,203.5051 272.8435,219.7851 " fill="none" id="A-to-WEB" style="stroke:#1F3A5F;stroke-width:1.1;"/><polygon fill="#1F3A5F" points="270.3,225.