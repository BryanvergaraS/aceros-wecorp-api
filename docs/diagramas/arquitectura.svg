/*</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="174.6992" x="153" y="408.7207">Authorization: Bearer JWT</text></g><!--link VEN to CAT--><g id="link_VEN_CAT"><path d="M173.75,547.4193 C179.19,557.3093 184.8,567.5993 190,577.2793 C206.36,607.7593 201.42,621.9393 226,646.2793 C237.3,657.4693 245.3783,664.2076 259.1883,672.9976 " fill="none" id="VEN-to-CAT" style="stroke:#1F3A5F;stroke-width:1.1;"/><polygon fill="#1F3A5F" points="264.25,676.2193,258.8053,668.0123,260.0319,673.5345,254.5097,674.7612,264.25,676.2193" style="stroke:#1F3A5F;stroke-width:1.1;"/><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="198.543" x="243.5396" y="591.8418">HTTP/JSON + JWT reenviado</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="231.6221" x="227" y="608.7813">IHttpClientFactory (CatalogoClient)</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="179.375" x="253.1235" y="625.7207">timeout 5 s, reintentos solo</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="122.0557" x="281.7832" y="642.6602">si la conexi&#243;n falla</text></g><!--link CAT to DBC--><g id="link_CAT_DBC"><path d="M384.71,781.2893 C384.07,806.8593 383.4701,830.9112 382.9201,852.8912 " fill="none" id="CAT-to-DBC" style="stroke:#1F3A5F;stroke-width:1.1;"/><polygon fill="#1F3A5F" points="382.77,858.8893,386.9939,849.9922,382.8951,853.8909,378.9964,849.7921,382.77,858.8893" style="stroke:#1F3A5F;stroke-width:1.1;"/><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="129.6846" x="384" y="825.8418">EF Core / TDS 1433</text></g><!--link VEN to DBV--><g id="link_VEN_DBV"><path d="M74.8,547.5293 C66.78,556.5193 59.79,566.4893 55,577.2793 C37.46,616.8193 53.9867,660.6666 70.8967,691.8066 " fill="none" id