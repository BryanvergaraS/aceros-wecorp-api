 CAT--><g id="elem_CAT"><rect fill="#F1F1F1" height="104.6973" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="248.2998" x="262" y="676.2793"/><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="184.0439" x="272" y="699.8418">API de Cat&#225;logo e Identidad</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="224.2051" x="272" y="716.7813">[ASP.NET Core 10, controladores]</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="228.2998" x="272" y="733.7207">Emite el JWT. Familias, productos,</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="108.042" x="272" y="750.6602">stock y usuarios</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="89.1064" x="272" y="767.5996">(puerto 5081)</text></g><!--entity VEN--><g id="elem_VEN"><rect fill="#F1F1F1" height="104.6973" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="244.2051" x="23" y="442.2793"/><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="92.8936" x="33" y="465.8418">API de Ventas</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="224.2051" x="33" y="482.7813">[ASP.NET Core 10, controladores]</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="164.3359" x="33" y="499.7207">Valida el JWT. Clientes y</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="97.8496" x="33" y="516.6602">notas de venta</text><text fill="#000000" font-family="Times New Roman" font-size="14" lengthAdjust="spacing" textLength="91.9502" x="33" y="533.5996">(puerto 5082)</text></g><!--entity DBC--><g id="elem_DBC"><path d="M305.5,869.2793 C305.5